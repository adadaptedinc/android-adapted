plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'com.google.gms.google-services'
}

android {
    compileSdk = 36
    namespace 'com.adadapted.androidadapted'

    defaultConfig {
        applicationId "com.adadapted.androidadapted"
        minSdk 28
        targetSdk 36
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlin {
        jvmToolchain(17)
        compilerOptions {
            // Annotations like @StringRes on constructor properties apply to the parameter and the property.
            freeCompilerArgs.add('-Xannotation-default-target=param-property')
        }
    }

    buildFeatures {
        compose true
    }
}

dependencies {
    // Compose. The BOM is aligned with the Compose version the SDK compiles against.
    implementation platform('androidx.compose:compose-bom:2026.01.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // AndroidX
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.activity:activity-compose:1.12.2'
    implementation 'androidx.navigation:navigation-compose:2.9.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.datastore:datastore:1.1.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'

    // AdAdapted SDK
    // Builds against the local ../android-sdk source by default: settings.gradle
    // swaps this for :advertising_sdk via a composite build, cloning the repo on
    // first sync if it's missing. This version only applies when local source is
    // off (adadapted.sdk.local=false) or the clone fails. See the "Local AdAdapted
    // SDK" section in settings.gradle.
    implementation 'com.github.adadaptedinc:android-sdk:6.0.0'

    // Firebase
    implementation platform('com.google.firebase:firebase-bom:32.3.1')
    implementation 'com.google.firebase:firebase-messaging'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.10.2'
}
